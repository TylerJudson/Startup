<!DOCTYPE html> 

<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Bite Club - Waiting Room</title>
        <link rel="icon" href="favicon.ico" />

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="main.css" />
    </head>
    
    <body>
        <header>
            <h1>Bite Club</h1>

            <!-- This is the active user: -->
            <span>Jake</span>
            
            <nav>
                <menu>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="start.html">Start</a></li>
                    <li><a href="waiting.html">Waiting</a></li>
                    <li><a href="vote.html">Vote</a></li>
                    <li><a href="results.html">Results</a></li>
                </menu>
            </nav>
            
        </header>
        
        <main class="waiting">
            <div class="code-box">
                <h3>JOIN CODE: <span id="join-code">ABCD</span></h3>
                <span>Copy the code above and share it with your friends!</span>
            </div>

            <!-- THIS WILL SHOW FOR THE HOST ONLY-->
            <!-- THE BUTTON WILL AUTO USE THEIR LOCATION WHILE 
                THE INPUT WILL ALLOW THE USER TO ENTER MANUALLY -->
            <div class="host-box">
                <span><b>Location:</b> not set</span>
                <button class="btn btn-outline-primary">Use my Location</button>
                <label for="location">Location</label>
                <input class="form-control" type="text" id="location" name="location" placeholder="Enter Location" />
            </div>

            <!-- NAMES WILL APPEAR HERE WITH A WEBSOCKET-->
            <div>
                <h3>Joined: </h3>
                <ul class="joined">
                    <li>You</li>
                    <li>Kate</li>
                    <li>Conner</li>
                    <li>Lily</li>
                </ul>
            </div>

            <form method="get" action="vote.html">
                <button class="btn btn-primary btn-lg" type="submit">Start Voting</button>
            </form>
        </main>
        
        <footer>
            <span>Tyler Judson</span>
            <br />
            <a href="https://github.com/TylerJudson/Startup">Github</a>
        </footer>
    </body>
</html>
